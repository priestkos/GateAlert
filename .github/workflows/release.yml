name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - 'screenshots/**'
      - '*.png'
      - '*.mp4'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare automatic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-FourPartVersion([string]$value) {
            $normalized = ($value -replace '^v', '').Trim()
            $parts = @($normalized -split '\.')
            while ($parts.Count -lt 4) {
              $parts += '0'
            }
            return [version]::new(
              [int]$parts[0],
              [int]$parts[1],
              [int]$parts[2],
              [int]$parts[3]
            )
          }

          $highestRelease = $null
          $tagNames = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate -q '.[].tag_name' 2>$null
          if ($tagNames) {
            foreach ($tagName in ($tagNames -split "`n")) {
              $tagName = $tagName.Trim()
              if ([string]::IsNullOrWhiteSpace($tagName)) { continue }
              if ($tagName -notmatch '^v\d') { continue }
              $candidate = Get-FourPartVersion $tagName
              if (-not $highestRelease -or $candidate -gt $highestRelease) {
                $highestRelease = $candidate
              }
            }
          }

          [xml]$project = Get-Content GateAlert/GateAlert.csproj
          $csprojVersionText = @($project.Project.PropertyGroup.Version)[0]
          if ([string]::IsNullOrWhiteSpace($csprojVersionText)) {
            throw 'Version element missing from GateAlert.csproj'
          }
          $csprojVersion = Get-FourPartVersion $csprojVersionText

          if (-not $highestRelease) {
            $nextVersion = $csprojVersion
          } elseif ($csprojVersion -gt $highestRelease) {
            $nextVersion = $csprojVersion
          } else {
            $nextVersion = [version]::new(
              $highestRelease.Major,
              $highestRelease.Minor,
              $highestRelease.Build,
              $highestRelease.Revision + 1
            )
          }

          $nextVersionText = "$($nextVersion.Major).$($nextVersion.Minor).$($nextVersion.Build).$($nextVersion.Revision)"
          $nextTag = "v$nextVersionText"
          Write-Host "Computed next release version: $nextVersionText ($nextTag)"

          $commitSha = $env:GITHUB_SHA
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate 2>$null
          if ($releasesJson) {
            $releases = @($releasesJson | ConvertFrom-Json)
            foreach ($release in $releases) {
              $target = [string]$release.target_commitish
              if ($target -eq $commitSha) {
                Write-Host "Commit $commitSha already has release $($release.tag_name); skipping."
                echo "SKIP_RELEASE=true" >> $env:GITHUB_ENV
                exit 0
              }
            }
          }

          gh release view $nextTag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $nextTag already exists; skipping."
            echo "SKIP_RELEASE=true" >> $env:GITHUB_ENV
            exit 0
          }

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$nextTag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $nextTag already exists; skipping."
            echo "SKIP_RELEASE=true" >> $env:GITHUB_ENV
            exit 0
          }

          echo "RELEASE_VERSION=$nextVersionText" >> $env:GITHUB_ENV

      - name: Install the Dalamud development distribution
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build GateAlert
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $buildArgs = @('build', 'GateAlert/GateAlert.csproj', '-c', 'Release')
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $buildArgs += @(
              "-p:Version=$($env:RELEASE_VERSION)",
              "-p:AssemblyVersion=$($env:RELEASE_VERSION)",
              "-p:FileVersion=$($env:RELEASE_VERSION)"
            )
          }
          dotnet @buildArgs

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Path GateAlert/bin/Release -Recurse -Filter latest.zip |
            Select-Object -First 1
          if (-not $zip) { throw 'latest.zip not found under bin/Release' }

          $pluginAssemblyName = 'GateAlert'

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $dllEntries = @($archive.Entries | Where-Object { $_.Name -like '*.dll' })
            if ($dllEntries.Count -eq 0) {
              throw 'No plugin .dll found inside latest.zip'
            }
            $dllEntry = $dllEntries | Where-Object {
              [System.IO.Path]::GetFileNameWithoutExtension($_.Name) -eq $pluginAssemblyName
            } | Select-Object -First 1
            if (-not $dllEntry) {
              $dllEntry = $dllEntries | Select-Object -First 1
            }
            $manifestName = [System.IO.Path]::ChangeExtension($dllEntry.Name, '.json')
            $manifestEntry = $archive.Entries | Where-Object { $_.Name -eq $manifestName }
            if (-not $manifestEntry) {
              throw "Manifest $manifestName not found inside latest.zip"
            }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try {
              $manifest = $reader.ReadToEnd() | ConvertFrom-Json
            } finally {
              $reader.Dispose()
            }
          } finally {
            $archive.Dispose()
          }

          $assemblyVersion = [string]$manifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($assemblyVersion)) {
            throw 'AssemblyVersion missing from plugin manifest'
          }

          $isTagPush = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/v*'
          $isMainPush = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'

          if ($isTagPush) {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $assemblyVersion) {
              throw "Tag version '$tagVersion' does not match manifest AssemblyVersion '$assemblyVersion'"
            }
            gh release create $tag $zip.FullName --title $tag --generate-notes
            exit 0
          }

          if ($isMainPush) {
            $expectedVersion = $env:RELEASE_VERSION
            if ($assemblyVersion -ne $expectedVersion) {
              throw "Manifest AssemblyVersion '$assemblyVersion' does not match computed release version '$expectedVersion'"
            }
            $tag = "v$assemblyVersion"
            gh release create $tag $zip.FullName --target $env:GITHUB_SHA --title $tag --generate-notes
            exit 0
          }

          $tag = "v$assemblyVersion"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }

          gh release create $tag $zip.FullName --title $tag --generate-notes
