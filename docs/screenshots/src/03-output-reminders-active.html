<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="dalamud-mock.css" />
  <title>03 — Output &amp; reminders</title>
</head>
<body class="scene-dim">
  <div style="width:1280px;height:720px;position:relative;">
    <div class="imwin" style="left:80px;top:60px;">
      <div class="imwin-title">Gate Alert <span class="x">×</span></div>
      <div class="imwin-body">
        <div class="row">
          <span class="gold">GATE ALERT</span>
          <button class="pill pill-armed">ARMED</button>
          <span class="muted" style="color:#f5c74a;opacity:0.55;">you are in the saucer</span>
        </div>

        <div class="sep"></div>
        <p class="gold" style="margin-bottom:8px;">OUTPUT</p>
        <div class="row">
          <label class="cb"><span class="cb-box">✓</span> Flavour text</label>
          <label class="cb"><span class="cb-box">✓</span> Also toast</label>
        </div>
        <div class="row">
          <label class="cb"><span class="cb-box off"></span> Only while inside the Gold Saucer</label>
        </div>
        <p class="muted" style="margin-bottom:6px;">Accent (chat colour palette key)</p>
        <div class="row">
          <button class="btn">gold 60</button>
          <button class="btn btn-accent">link 500</button>
          <input class="input input-sm" type="text" value="500" readonly />
          <span class="muted">preview of the accent</span>
          <span class="gold">★ GATE</span>
        </div>

        <div class="sep"></div>
        <p class="gold" style="margin-bottom:8px;">REMINDERS</p>
        <div class="slider-row">
          <span class="slider-label">times</span>
          <div class="slider-track"><div class="slider-fill" style="width:33%;"></div><div class="slider-knob" style="left:33%;"></div></div>
          <span class="muted">4</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">every (s)</span>
          <div class="slider-track"><div class="slider-fill" style="width:8%;"></div><div class="slider-knob" style="left:8%;"></div></div>
          <span class="muted">30</span>
          <button class="btn" style="margin-left:8px;">stop nagging</button>
        </div>
        <p class="muted" style="font-size:11px;">Repeats print as GATE ALERT (2/4): … in chat until cancelled or finished.</p>
      </div>
    </div>
  </div>
</body>
</html>
